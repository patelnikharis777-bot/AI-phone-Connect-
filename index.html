<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Phone Connect</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
}
header{
  background:#17243a;
  padding:22px;
  text-align:center;
}
header h1{color:#54d6ff;margin:0}
.container{padding:18px;max-width:600px;margin:auto}
.card{
  background:#1c2b42;
  padding:20px;
  margin:15px 0;
  border-radius:14px;
}
h2{color:#54d6ff}
button{
  background:#168bd0;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  margin:5px 0;
  width:100%;
  font-size:16px;
}
input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:0;
  margin:8px 0;
}
video{width:100%;border-radius:10px}
#status{color:#8fffb0}
</style>
</head>

<body>

<header>
<h1>AI Phone Connect</h1>
<p>Connect your devices easily</p>
</header>

<div class="container">

<div class="card">
<h2>📱 Phone Connection</h2>
<button onclick="createCode()">Generate Pair Code</button>
<h3 id="myCode">Your Code: ------</h3>
<input id="joinCode" placeholder="Enter 12-digit code">
<button onclick="joinPhone()">Connect Phone</button>
<p id="status">Waiting for connection...</p>
</div>

<div class="card">
<h2>🖥️ Screen Sharing</h2>
<p>Share your screen with browser permission.</p>
<button onclick="shareScreen()">Start Screen Preview</button>
<video id="screenVideo" autoplay playsinline></video>
<p id="screenStatus"></p>
</div>

<div class="card">
<h2>🤖 AI Assistant</h2>
<input id="question" placeholder="Ask something...">
<button onclick="askAI()">Ask AI</button>
<p id="answer">AI demo is ready.</p>
</div>

<div class="card">
<h2>🌐 Public Website</h2>
<p>Your website is online.</p>
<button onclick="copyLink()">Copy Website Link</button>
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {getAuth, signInAnonymously}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
getDatabase, ref, set, onValue
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCT72IBoLugqBMoAZrmqcQ1Q42ZnHsxnCw",
  authDomain: "ai-phone-connect.firebaseapp.com",
  projectId: "ai-phone-connect",
  databaseURL: "https://ai-phone-connect-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "ai-phone-connect.firebasestorage.app",
  messagingSenderId: "851919597957",
  appId: "1:851919597:web:96e9740be52c6a1a5814ec"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let myUid = null;

signInAnonymously(auth)
.then(result => {
  myUid = result.user.uid;
  document.getElementById("status").innerText =
    "Firebase connected. Ready to pair!";
})
.catch(error => {
  document.getElementById("status").innerText =
    "Connection error: " + error.message;
});

function randomCode(){
  return Array.from(crypto.getRandomValues(new Uint8Array(12)))
.map(x => "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[x % 36])
.join("");
}

window.createCode = async function(){
  if(!myUid){
    alert("Please wait for Firebase connection.");
    return;
  }

  const code = randomCode();

  try{
    await set(ref(db,"rooms/"+code+"/ownerUid"),myUid);

    document.getElementById("myCode").innerText =
      "Your Code: " + code;

    document.getElementById("status").innerText =
      "Waiting for another phone...";

    onValue(ref(db,"rooms/"+code+"/guestUid"),snapshot=>{
      if(snapshot.exists()){
        document.getElementById("status").innerText =
          "Second phone connected!";
      }
    });

  }catch(error){
    alert("Error: "+error.message);
  }
};

window.joinPhone = async function(){
  if(!myUid){
    alert("Please wait for Firebase connection.");
    return;
  }

  const code = document.getElementById("joinCode")
    .value.trim().toUpperCase();

  if(code.length !== 12){
    alert("Enter a valid 12-character code.");
    return;
  }

  try{
    await set(ref(db,"rooms/"+code+"/guestUid"),myUid);
    document.getElementById("status").innerText =
      "Pair request sent!";
  }catch(error){
    alert("Connection error: "+error.message);
  }
};

window.shareScreen = async function(){
  try{
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video:true
    });

    document.getElementById("screenVideo").srcObject = stream;
    document.getElementById("screenStatus").innerText =
      "Screen preview started.";

    stream.getVideoTracks()[0].onended = ()=>{
      document.getElementById("screenStatus").innerText =
        "Screen sharing stopped.";
    };

  }catch(error){
    document.getElementById("screenStatus").innerText =
      "Screen sharing is not supported or permission was denied.";
  }
};

window.askAI = function(){
  const q = document.getElementById("question").value.trim();

  document.getElementById("answer").innerText =
    q ? "AI demo: A real AI assistant needs a secure AI service connection."
      : "Please type a question.";
};

window.copyLink = async function(){
  const link = location.href;
  try{
    await navigator.clipboard.writeText(link);
    alert("Website link copied!");
  }catch(error){
    alert(link);
  }
};

</script>
</body>
</html>
